<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Portal | gofficial.github.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #58a6ff;
            font-size: 2rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #8b949e;
        }
        .status-badge {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #484f58;
            border-top: 1px solid #21262d;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">System Online</div>
        <h1>gofficial.github.io</h1>
        <p>ওয়েলকাম! এটি আপনার অফিশিয়াল পোর্টাল। নতুন কোনো সিস্টেম বা ড্যাশবোর্ড আপডেট করার জন্য তৈরি রাখা হয়েছে।</p>
        
        <div class="footer">
            Powered by GitHub Pages
        </div>
    </div>

</body>
</html>
